# Gradle 8.14 cannot run on Java 25, so buildSrc fails on machines whose default JDK is
# newer than 21. Point the daemon at a JDK 21 in your own ~/.gradle/gradle.properties
# rather than here, so the path does not travel with the repo:
#   org.gradle.java.home=/path/to/jdk-21

