# Terrain Diffusion MC configuration

# Inference device: "cpu", "gpu", or "auto" (try GPU first then fall back to CPU).
# Ignored for the CPU build.
inference.device=gpu

# Offload inactive models from VRAM so only one model occupies the GPU at a time.
# Keeps peak VRAM to 1.5-2 GB. Set to false if you have ~2.5+ GB of free VRAM for
# slightly faster generation (avoids reloading sessions between pipeline stages).
inference.offload_models=true

# Validate SHA-256 for pre-existing files in .minecraft/terrain-diffusion-models.
# Set to false to allow custom user-provided models/config without hash checks.
validate_model=true

# Port for the local terrain explorer web UI (started with /td-explore command).
explorer.port=19801

# Terrain generation region side length in blocks. Must be a power of 2.
# Examples: 128, 256, 512, 1024.
# Use larger values to generate in larger batches (more chunks per second)
# Use smaller values to generate in smaller batches (most responsive)
tile_size=256

# Decoded model windows held in memory, in MB, per tensor. The pipeline keeps four of them, so the
# real ceiling is about four times this value. Raising it is the single most effective change for
# revisiting explored terrain, which otherwise has to be decoded again.
tile_cache_mb=512

# Spawn search: coarse-pixel region sizes for land detection near (0,0).
# Starts at initial_size x initial_size, expands by 8 each iteration up to max_size x max_size.
spawn_search.initial_size=16
spawn_search.max_size=128

# Snow lies deeper the colder the ground is, instead of a uniform single layer everywhere.
# Depth uses the terrain model's own temperature in Celsius: 1 to 7 layers from -5 C to
# -7.5 C, then a full snow block plus a further 1 to 7 layers from -7.5 C to -10 C.
# Set to false for vanilla's flat one-layer snow.
snow.depth_scaling=true
# Layer cap where snow is covering vegetation instead of bare ground. Snow Real Magic keeps
# the plant alive underneath and enforces its own ceiling on those columns, so keep this equal
# to its accumulation.maxLayers. Ignored when Snow Real Magic is not installed.
snow.max_layers_over_vegetation=6

# Place Terralith's biomes when Terralith is installed. Terrain Diffusion replaces the
# biome source, so Terralith's own biome placement never runs and its biomes are
# unreachable without this. Set to false to keep the vanilla-only palette.
terralith.enabled=true

# When Terralith is installed, prepend its surface rules to this mod's, so Terralith
# biomes get the surface blocks that identify them (calcite cliffs, tuff yellowstone,
# basalt, painted terracotta). Two side effects: vanilla biomes also pick up Terralith's
# surfaces rather than this mod's, and Terralith's height-anchored rules were written for
# a 384-block world so they can read oddly at extreme altitude. Set to false to keep this
# mod's surfaces everywhere, at the cost of Terralith biomes looking generic.
terralith.inject_surface_rules=true

# Adapt Create: The Factory Must Grow's world generation when TFMG is installed. TFMG pins
# both of its oil features to an absolute Y -64, which is the vanilla world floor and 128
# blocks above this dimension's, and neither of them checks what it is replacing, so at that
# height they land inside the deep cavern bands and hang oil in open air. Set to false to
# leave TFMG's generation exactly as it ships.
tfmg.enabled=true

# Y the oil deposit and oil well start from. The bedrock gradient runs from the world floor
# up five blocks, so a placement here rises to the first block of real rock before it writes
# anything and a deposit is never embedded in bedrock.
tfmg.oil_y=-189

# Blocks in one striated ore body (bauxite, galena, lignite, fireclay). TFMG ships 32, tuned
# for vanilla cave density; Create's codec caps the value at 64.
tfmg.striated_ore_size=64

# Oil deposit shape. One placement in oil_deposit_rarity produces a deposit, which scatters
# up to oil_deposit_blobs pockets, each rising up to oil_deposit_height blocks. A pocket stops
# where the rock does, so it cannot spill into a cave. Spread is clamped to 8 because that is
# how far from the chunk it is decorating worldgen may write; TFMG's own deposit walks up to
# 20 blocks per pocket and cumulatively far past that, which silently drops the writes that
# land outside.
tfmg.oil_deposit_rarity=20
tfmg.oil_deposit_blobs=6
tfmg.oil_deposit_height=25
tfmg.oil_deposit_spread=8

# Oil well column and the slick it leaves. The column ends this many blocks from the surface
# (0 reaches it) and only ever replaces rock, so it skips any cave it passes through instead
# of hanging a pipe of oil in the void. Pool radius is clamped to 8 to stay inside the area
# worldgen may write.
tfmg.oil_well_surface_offset=0
tfmg.oil_well_pool_radius=8
